<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f3a8a">
<title>중부 근무표</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="중부 근무표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#2f6fed,#1f3a8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lock img{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#lock h1{margin:6px 0 0;font-size:22px}#lock p{margin:0;opacity:.85;font-size:14px}
#pin{width:190px;text-align:center;font-size:28px;letter-spacing:12px;border:0;border-radius:14px;padding:12px;outline:none;color:#16181d}
#pinBtn{width:190px;background:#fff;color:#1f3a8a;font-weight:800;border-radius:14px;padding:13px;font-size:16px}
#pinErr{min-height:20px;font-size:13px;color:#ffd8d8}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#f2f3f7; --card:#fff; --text:#16181d; --sub:#6b7280; --line:#e5e7eb; --brand:#1f3a8a; --brand2:#3b5bdb;
  --D:#2f6fed; --Dbg:#e6efff; --E:#e8890c; --Ebg:#fff3e0; --N:#6741d9; --Nbg:#efe9ff; --O:#8a8f98; --Obg:#f0f1f3; --V:#12a150; --Vbg:#e3f7ea; --F:#d9480f; --Fbg:#ffe8dc; --W:#0c8599; --Wbg:#dff6f8; --X:#c2255c; --Xbg:#ffe3ec;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --card:#1a1d23; --text:#eef0f4; --sub:#9aa1ad; --line:#2a2e36; --brand:#5b7cfa; --brand2:#7c95ff;
  --Dbg:#1b2a4a; --Ebg:#3a2a12; --Nbg:#2a2148; --Obg:#25282e; --Vbg:#143524; --D:#6f9bff; --E:#ffad42; --N:#a48bff; --O:#9aa1ad; --V:#4cd486; --F:#ff8a5c; --Fbg:#3d2216; --W:#3bc9db; --Wbg:#12333a; --X:#f783ac; --Xbg:#3a1a27;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.sample{background:#fff7d6;color:#7a5b00;font-size:12px;text-align:center;padding:6px 10px}
@media (prefers-color-scheme:dark){.sample{background:#3a3110;color:#f3d36b}}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
header .t{font-size:24px;font-weight:800;letter-spacing:-.5px}
header .s{font-size:12px;color:var(--sub);margin-top:2px}
.me-btn{display:flex;align-items:center;gap:8px;background:var(--card);padding:6px 10px 6px 6px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
main{padding:0 16px}
.view{display:none;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.h{font-size:15px;font-weight:700;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.h small{font-weight:500;color:var(--sub);font-size:12px}
/* hero */
.hero{border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-1px}
.hero .tm{font-size:16px;font-weight:500;opacity:.95}
.hero .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero .pill{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.hero svg{position:absolute;right:-20px;top:-20px;opacity:.15}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip .d{background:var(--card);border-radius:14px;padding:8px 0;text-align:center;box-shadow:var(--shadow)}
.strip .d .w{font-size:11px;color:var(--sub)}
.strip .d .n{font-size:15px;font-weight:700;margin:2px 0 6px}
.strip .d.today{outline:2px solid var(--brand)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px}
/* people list */
.grp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:10px}
.grp .cnt{color:var(--sub);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px}
.chip .av{width:24px;height:24px;font-size:11px}
.chip.me{outline:2px solid var(--brand)}
.chip small{color:var(--sub);font-size:11px}
.offline{font-size:13px;color:var(--sub)}
/* calendar */
.navrow{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px}
.navrow .ttl{font-size:18px;font-weight:800}
.navbtn{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{text-align:center;font-size:11px;color:var(--sub);padding:4px 0}
.cal .wh:first-child,.cal .c.sun .num{color:#e03131}
.cal .wh:last-child,.cal .c.sat .num{color:#3b5bdb}
.cal .c{aspect-ratio:1/1.25;border-radius:12px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent}
.cal .c.in{background:var(--card)}
.cal .c.out{opacity:.35}
.cal .c .num{font-size:13px;font-weight:600}
.cal .c.today{outline:2px solid var(--brand)}
.cal .c .tag{font-size:10px;padding:2px 5px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.sum div{background:var(--card);border-radius:12px;padding:10px 0;text-align:center;box-shadow:var(--shadow)}
.sum b{display:block;font-size:18px}
.sum span{font-size:11px;color:var(--sub)}
/* team table */
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;border:0;background:var(--card);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-size:14px;box-shadow:var(--shadow);outline:none}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{white-space:nowrap;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.tbl{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tr{display:grid;grid-template-columns:64px repeat(7,1fr);align-items:center;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr.head{font-size:11px;color:var(--sub);text-align:center}
.tr.head div{padding:8px 0}
.tr.head .td{color:var(--brand);font-weight:800}
.tr .nm{padding:10px 0 10px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tr .nm small{display:block;font-size:10px;color:var(--sub);font-weight:500}
.tr.mine{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.cell{margin:2px 1px;min-height:38px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;line-height:1.15}.cell i{font-style:normal;font-weight:500;font-size:9px;opacity:.85}.subrow{padding:6px 12px;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg)}.memo{display:block;font-size:9px;color:var(--X);font-weight:700;line-height:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:12px 4px}
.legend span{display:flex;align-items:center;gap:4px}
/* notice */
.nt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:16px}
.nt .tt{font-size:14px;font-weight:600}
.nt .dd{font-size:12px;color:var(--sub);margin-top:3px}
.new{background:#e03131;color:#fff;font-size:10px;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.steps li{margin:6px 0;font-size:14px;line-height:1.5}
/* tabbar */
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);position:relative}
nav button.on{color:var(--brand);font-weight:700}
nav svg{width:24px;height:24px}
nav .badge{position:absolute;top:5px;left:calc(50% + 6px);background:#e03131;color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
.pick .info{flex:1}
.pick .info small{display:block;color:var(--sub);font-size:12px}
.primary{width:100%;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-weight:700;margin-top:14px}
</style><style>.seg{overflow-x:auto;max-width:100%}.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.chips button{white-space:nowrap;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--sub)}.chips button.on{background:var(--brand);color:#fff;font-weight:700}.chip .tm{color:var(--sub);font-size:11px}.empty{padding:28px;text-align:center;color:var(--sub);font-size:14px}</style>
<style>:root{--sat:#3b5bdb;--satbg:#eef2ff;--sun:#e03131;--sunbg:#fff0f0}@media (prefers-color-scheme:dark){:root{--sat:#8ea2ff;--satbg:#1c2340;--sun:#ff8787;--sunbg:#3a1c1f}}.strip .d.sat{background:var(--satbg)}.strip .d.sun{background:var(--sunbg)}.strip .d.sat .w,.strip .d.sat .n{color:var(--sat)}.strip .d.sun .w,.strip .d.sun .n{color:var(--sun)}.cal .c.in.sat{background:var(--satbg)}.cal .c.in.sun{background:var(--sunbg)}.cal .c.sat .num{color:var(--sat)}.cal .c.sun .num,.cal .wh:first-child{color:var(--sun)}.cal .wh:last-child{color:var(--sat)}.tr.head .sat{color:var(--sat);background:var(--satbg)}.tr.head .sun{color:var(--sun);background:var(--sunbg)}.tr.head .td{color:var(--brand)}</style>
<style>
.tl-subs{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px}
.tl-subs button{white-space:nowrap;background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--sub)}
.tl-subs button.on{background:var(--brand);color:#fff;font-weight:700}
.tl{position:relative}
.tl-axis,.tl-row,.tl-cnt{display:grid;grid-template-columns:50px 1fr;align-items:center}
.tl-axis .tk{position:relative;height:16px;font-size:10px;color:var(--sub)}
.tl-axis .tk span{position:absolute;transform:translateX(-50%);top:0}
.tl-row{height:30px}
.tl-row .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.tl-row.me .nm{color:var(--brand)}
.track{position:relative;height:22px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/12));border-radius:6px}
.bar{position:absolute;top:2px;bottom:2px;border-radius:6px;font-size:10px;font-weight:700;display:flex;align-items:center;padding:0 5px;white-space:nowrap;overflow:hidden}
.tl-cnt{margin-top:6px}
.tl-cnt .lb{font-size:11px;color:var(--sub);font-weight:600}
.cnts{display:grid;grid-template-columns:repeat(24,1fr);gap:1px}
.cnts div{height:20px;border-radius:3px;font-size:9.5px;font-weight:700;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) calc(var(--k)*18%),var(--bg));color:var(--text)}
.cnts div.zero{background:#ffe3e3;color:#e03131}
@media (prefers-color-scheme:dark){.cnts div.zero{background:#3a1c1f;color:#ff8787}}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:#e03131;z-index:2;pointer-events:none}
.nowline:before{content:'지금';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:#e03131;background:var(--card);padding:0 2px;white-space:nowrap}
.tl-off{font-size:12px;color:var(--sub);margin-top:10px}
</style>
</head>
<body>
<div id="lock"><img src="icon-192.png" alt=""><h1>중부 근무표</h1><p>비밀번호를 입력하세요</p>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><button id="pinBtn">열기</button><div id="pinErr"></div></div>
<header>
  <div>
    <div class="t" id="hTitle">오늘</div>
    <div class="s">중부권지사 STAFF · <span id="upd"></span> 업데이트</div>
  </div>
  <button class="me-btn" id="meBtn"><span class="av" id="meAv"></span><span id="meNm"></span></button>
</header>
<main>
  <section class="view on" id="v-today">
    <div class="hero" id="hero"></div>
    <div class="h">이번 주 내 근무 <small>탭하면 상세</small></div>
    <div class="strip" id="strip"></div>
    <div class="h"><span id="tlTitle">시간대별 근무</span> <small>08시 ~ 다음날 08시</small></div>
    <div class="card" id="tlCard"></div>
    <div class="h">오늘 근무자 <small id="todayCnt"></small></div>
    <div id="todayList"></div>
  </section>
  <section class="view" id="v-mine">
    <div class="navrow"><button class="navbtn" data-m="-1">‹</button><div class="ttl" id="calTtl"></div><button class="navbtn" data-m="1">›</button></div>
    <div class="card" style="padding:10px" id="calWrap"><div class="cal" id="cal"></div></div>
    <div class="sum" id="sum"></div>
  </section>
  <section class="view" id="v-team">
    <div class="search"><input id="q" placeholder="이름 검색" autocomplete="off"></div>
    <div class="chips" id="subs"></div>
    <div class="navrow"><button class="navbtn" data-w="-1">‹</button><div class="ttl" id="wkTtl" style="font-size:16px"></div><button class="navbtn" data-w="1">›</button></div>
    <div class="tbl" id="tbl"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="view" id="v-notice">
    <div class="h" style="margin-top:4px">연차 · 특이 일정 <small id="evRange"></small></div>
    <div class="card" id="ev" style="padding:4px 16px"></div>
    <div class="h">근무 시간 기준</div>
    <div class="card" id="hours" style="font-size:13px;line-height:1.9"></div>
    <div class="h">홈 화면에 앱 추가하기</div>
    <div class="card">
      <b style="font-size:14px">아이폰 (사파리)</b>
      <ol class="steps"><li>하단 공유 버튼 <b>⬆︎</b> 누르기</li><li><b>홈 화면에 추가</b> 선택</li></ol>
      <b style="font-size:14px">갤럭시 (크롬·삼성인터넷)</b>
      <ol class="steps"><li>우측 상단 <b>⋮</b> 또는 하단 <b>≡</b> 메뉴</li><li><b>홈 화면에 추가</b> 선택</li></ol>
    </div>
  </section>
</main>
<nav><div class="in">
  <button class="on" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button data-v="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>내 근무</button>
  <button data-v="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.4 4.6 4"/></svg>전체 근무</button>
  <button data-v="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>일정</button>
</div></nav>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<script type="text/plain" id="appjs">
const DATA=window.__D;
const P=DATA.people, SUBS=[...new Set(P.map(p=>p.sub))];
const COLORS=['#3b5bdb','#e8590c','#0ca678','#ae3ec9','#1098ad','#f08c00','#d6336c','#5c940d','#4263eb','#c2255c','#2b8a3e','#7048e8','#495057','#e67700'];
const CAT={D:'주간',E:'석간1',F:'석간2',N:'야간',W:'당직',O:'휴무',V:'연차',X:'기타'};
const ORDER=['D','E','F','N','W'];
function cat(s){if(!s)return null;const l=s.l;if(l.startsWith('주간'))return'D';if(l.startsWith('석간1'))return'E';if(l.startsWith('석간2'))return'F';if(l.startsWith('야간'))return'N';if(l.startsWith('당직'))return'W';if(l.startsWith('휴무'))return'O';if(l.startsWith('연차'))return'V';return'X'}
function short(s){const c=cat(s);return {D:'주',E:'석1',F:'석2',N:'야',W:'당',O:'휴',V:'연'}[c]||s.l.slice(0,2)}
const WORKC=c=>ORDER.includes(c);
const WD=['일','월','화','수','목','금','토'];
const T0=new Date();T0.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
const get=(pi,d)=>{const r=DATA.days[iso(d)];return r?r[pi]:undefined};
const memo=(pi,d)=>(DATA.memos[iso(d)]||[]).filter(m=>m.p==pi).map(m=>m.x);
const tagS=s=>{const c=cat(s);return `<span class="tag" style="background:var(--${c}bg);color:var(--${c})">${s.l}<\/span>`};

function renderToday(){

  else{
    const c=cat(s), grad={D:'#2f6fed,#1f3a8a',E:'#f59f00,#e8590c',F:'#f76707,#c92a2a',N:'#7048e8,#3b2a8a',W:'#15aabf,#0b7285',O:'#868e96,#495057',V:'#20c997,#0b7a48',X:'#e64980,#a61e4d'}[c];
    let nextOff=0;for(let i=1;i<40;i++){const x=get(me,addD(T0,i));if(!x)break;if(!WORKC(cat(x))){nextOff=i;break}}
    const tm=get(me,addD(T0,1)), mm=memo(me,T0);

  }
  $('strip').innerHTML=[...Array(7)].map((_,i)=>{const d=addD(wkS,i),s=get(me,d),c=cat(s);return `<button class="d ${iso(d)==iso(T0)?'today':''} ${d.getDay()==0?'sun':d.getDay()==6?'sat':''}" data-day="${iso(d)}"><div class="w">${WD[d.getDay()]}<\/div><div class="n">${d.getDate()}<\/div>${s?`<span class="tag" style="background:var(--${c}bg);color:var(--${c})">${short(s)}<\/span>`:'<span class="tag">-<\/span>'}<\/button>`}).join('');

let tlSub=null;
function span(s){if(!s||!s.t||!ORDER.includes(cat(s)))return null;const m=s.t.match(/(\d+):(\d+)–(\d+):(\d+)/);if(!m)return null;let a=+m[1]+m[2]/60,b=+m[3]+m[4]/60;if(b<=a)b+=24;return [a,b]}
function timeline(d,el,subSel,showChips){
  const row=DATA.days[iso(d)];const S=subSel||(me!=null?P[me].sub:SUBS[0]);
  if(!row){$(el).innerHTML='<div class="empty">이 날짜 근무표가 없어요<\/div>';return}
  const W0=8,W1=32,pct=h=>((Math.min(Math.max(h,W0),W1)-W0)/(W1-W0)*100);
  const ids=P.map((p,i)=>i).filter(i=>P[i].sub==S);
  const work=ids.filter(i=>span(row[i])), off=ids.filter(i=>!span(row[i]));
  work.sort((a,b)=>span(row[a])[0]-span(row[b])[0]);
  let h='';
  if(showChips)h+=`<div class="tl-subs">${SUBS.map(s=>`<button class="${s==S?'on':''}" data-tlsub="${s}">${s}${me!=null&&P[me].sub==s?' (내 거점)':''}<\/button>`).join('')}<\/div>`;
  h+='<div class="tl">';
  h+=`<div class="tl-axis"><div><\/div><div class="tk">${[8,11,14,17,20,23,26,29,32].map(x=>`<span style="left:${pct(x)}%">${String(x%24).padStart(2,'0')}<\/span>`).join('')}<\/div><\/div>`;
  h+=work.map(i=>{const s=row[i],[a,b]=span(s),c=cat(s);return `<div class="tl-row ${i==me?'me':''}"><div class="nm">${P[i].n}<\/div><div class="track"><div class="bar" style="left:${pct(a)}%;width:${pct(b)-pct(a)}%;background:var(--${c}bg);color:var(--${c});outline:1px ${s.l.includes('N4')?'dashed':'solid'} var(--${c})${s.l.includes('N4')?';opacity:.75':''}">${s.l.replace(/\(N4\)/,' N4')} ${s.t.replace(/:00/g,'').replace(':30','.5').replace('–','-')}<\/div><\/div><\/div>`}).join('')||'<div class="empty" style="padding:12px">근무자 없음<\/div>';
  const cnt=[...Array(24)].map((_,k)=>{const hh=W0+k+0.5;return work.filter(i=>{if(row[i].l.includes('N4'))return false;const[a,b]=span(row[i]);return a<=hh&&hh<b}).length});
  const mx=Math.max(1,...cnt);
  h+=`<div class="tl-cnt"><div class="lb">인원${work.some(i=>row[i].l.includes('N4'))?'<br><span style="font-size:9px;font-weight:500">N4 제외<\/span>':''}<\/div><div class="cnts">${cnt.map(n=>`<div class="${n?'':'zero'}" style="--k:${(n/mx*4).toFixed(2)}">${n}<\/div>`).join('')}<\/div><\/div>`;
  const now=new Date();let nh=null;
  if(iso(d)==iso(T0)){nh=now.getHours()+now.getMinutes()/60;if(nh<8)nh=null}
  else if(iso(addD(d,1))==iso(T0)){nh=24+now.getHours()+now.getMinutes()/60;if(nh>=32)nh=null}
  h+='<\/div>';
  if(off.length)h+=`<div class="tl-off">휴무·기타: ${off.map(i=>P[i].n+(row[i]&&cat(row[i])!='O'?'('+row[i].l+')':'')).join(', ')}<\/div>`;
  $(el).innerHTML=h;
  if(nh!=null){const tl=$(el).querySelector('.tl'),trk=tl.querySelector('.track')||tl.querySelector('.tk');if(trk){const L=trk.offsetLeft+trk.offsetWidth*pct(nh)/100;const ln=document.createElement('div');ln.className='nowline';ln.style.left=L+'px';tl.appendChild(ln)}}
}

function dayGroups(d,el,cntEl){
  const row=DATA.days[iso(d)];
  if(!row){$(el).innerHTML='<div class="card empty">이 날짜 근무표가 없어요<\/div>';if(cntEl)$(cntEl).textContent='';return}
  const by={};row.forEach((s,i)=>{const c=cat(s)||'O';(by[c]=by[c]||[]).push(i)});
  const working=ORDER.reduce((a,c)=>a+(by[c]||[]).length,0);
  if(cntEl)$(cntEl).textContent=`${working}명 근무 · ${P.length-working}명 휴무 등`;
  $(el).innerHTML=ORDER.filter(c=>by[c]).map(c=>`<div class="card"><div class="grp"><span class="dot" style="background:var(--${c})"><\/span>${CAT[c]} <span class="cnt">${by[c].length}명<\/span><\/div><div class="plist">${by[c].map(i=>`<span class="chip ${i==me?'me':''}">${av(i)}${P[i].n}<span class="tm">${row[i].t.replace('–','~')}${row[i].l.includes('N4')?' N4':''}<\/span><\/span>`).join('')}<\/div><\/div>`).join('')
   +`<div class="card offline">${['O','V','X'].filter(c=>by[c]).map(c=>`<b>${CAT[c]=='기타'?'기타':CAT[c]}<\/b> ${by[c].map(i=>P[i].n+(c=='X'?'('+row[i].l+')':'')).join(', ')}`).join('<br>')||'휴무자 없음'}<\/div>`;
}
function renderCal(){
  if(me==null)return;
  const y=calM.getFullYear(),m=calM.getMonth();$('calTtl').textContent=`${y}년 ${m+1}월`;
  const start=addD(calM,-calM.getDay());let h=WD.map(w=>`<div class="wh">${w}<\/div>`).join('');const cnt={};
  for(let i=0;i<42;i++){const d=addD(start,i),inM=d.getMonth()==m;if(i>=35&&!inM&&d.getDay()==0)break;const s=get(me,d),c=cat(s);if(inM&&c)cnt[c]=(cnt[c]||0)+1;const mm=memo(me,d);
    h+=`<button class="c ${inM?'in':'out'} ${iso(d)==iso(T0)?'today':''} ${d.getDay()==0?'sun':d.getDay()==6?'sat':''}" data-day="${iso(d)}"><span class="num">${d.getDate()}<\/span>${s?`<span class="tag" style="background:var(--${c}bg);color:var(--${c})">${short(s)}<\/span>`:''}${mm.length?'<span class="memo">📌<\/span>':''}<\/button>`}
  $('cal').innerHTML=h;
  $('sum').innerHTML=['D','E','F','N','W','O','V','X'].map(c=>`<div><b style="color:var(--${c})">${cnt[c]||0}<\/b><span>${CAT[c]}<\/span><\/div>`).join('');
}
function renderTeam(){
  $('subs').innerHTML=['',...SUBS].map(s=>`<button class="${s==sub?'on':''}" data-sub="${s}">${s||'전체'}<\/button>`).join('');
  const e=addD(wkS,6);$('wkTtl').textContent=`${md(wkS)} – ${md(e)}`;
  const days=[...Array(7)].map((_,i)=>addD(wkS,i));
  let h=`<div class="tr head"><div><\/div>${days.map(d=>`<div class="${iso(d)==iso(T0)?'td':''} ${d.getDay()==0?'sun':d.getDay()==6?'sat':''}">${WD[d.getDay()]}<br>${d.getDate()}<\/div>`).join('')}<\/div>`;
  let last=null,any=false;
  P.forEach((p,i)=>{if((sub&&p.sub!=sub)||(q&&!p.n.includes(q)))return;any=true;
    if(p.sub!=last){h+=`<div class="subrow">${p.sub}<\/div>`;last=p.sub}
    h+=`<div class="tr ${i==me?'mine':''}"><div class="nm">${p.n}${i==me?'<small>나<\/small>':''}<\/div>${days.map(d=>{const s=get(i,d);if(!s)return '<div class="cell" style="opacity:.3">-<\/div>';const c=cat(s),mm=memo(i,d);return `<div class="cell" data-day="${iso(d)}" style="background:var(--${c}bg);color:var(--${c})">${short(s)}${s.t?`<i>${s.t.replace(/:00/g,'').replace(':30','.5').replace('–','-')}<\/i>`:''}${mm.length?'<span class="memo">📌<\/span>':''}<\/div>`}).join('')}<\/div>`});
  if(!any)h+='<div class="empty">검색 결과 없음<\/div>';
  if(!DATA.days[iso(wkS)]&&!DATA.days[iso(e)])h+='<div class="empty">이 주 근무표는 아직 없어요<\/div>';
  $('tbl').innerHTML=h;
}
function renderNotice(){
  const items=[];
  DKEYS.forEach(k=>{const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);if(dt<addD(T0,-7))return;
    DATA.days[k].forEach((s,i)=>{const c=cat(s);if(c=='V'||c=='X')items.push({dt,i,t:s.l,c})});
    (DATA.memos[k]||[]).forEach(mo=>items.push({dt,i:mo.p,t:mo.x,c:'memo'}))});

  $('ev').innerHTML=items.map(x=>`<div class="nt" ${iso(x.dt)<iso(T0)?'style="opacity:.45"':''}><div class="ic" style="background:var(--${x.c=='memo'?'Ebg':x.c+'bg'})">${x.c=='V'?'🌴':x.c=='memo'?'📌':'📋'}<\/div><div><div class="tt">${md(x.dt)}(${WD[x.dt.getDay()]}) ${P[x.i].n} · ${x.t}${iso(x.dt)==iso(T0)?'<span class="new">오늘<\/span>':''}<\/div><div class="dd">${P[x.i].sub}<\/div><\/div><\/div>`).join('')||'<div class="empty">예정된 일정 없음<\/div>';
  const H={};DKEYS.forEach(k=>DATA.days[k].forEach((s,i)=>{if(s&&s.t&&ORDER.includes(cat(s))){const kk=s.l.replace(/\(.*\)/,'');(H[kk]=H[kk]||new Set()).add(s.t)}}));
  $('hours').innerHTML=Object.keys(H).map(k=>`<div><b>${k}<\/b> <span style="color:var(--sub)">${[...H[k]].join(' / ')}<\/span><\/div>`).join('');
}
$('legend').innerHTML=['D','E','F','N','W','O','V'].map(c=>`<span><span class="dot" style="background:var(--${c})"><\/span>${CAT[c]}<\/span>`).join('')+'<span>📌 메모<\/span>';

$('dim').onclick=closeSheet;
function pickMe(){openSheet(`<h3>${me==null?'처음 오셨네요 👋':'사용자 변경'}<\/h3><div class="sub">본인 이름을 한 번만 고르면 다음부터 내 근무가 먼저 보여요<\/div>`+P.map((p,i)=>`<button class="pick" data-pick="${i}">${av(i,38)}<div class="info"><b>${p.n}<\/b><small>${p.sub}<\/small><\/div>${i==me?'✓':''}<\/button>`).join(''))}
function dayDetail(k){const [y,m,dd]=k.split('-').map(Number),d=new Date(y,m-1,dd),s=get(me,d),mm=(DATA.memos[k]||[]);

document.addEventListener('click',e=>{
  const p=e.target.closest('[data-pick]');if(p){me=+p.dataset.pick;try{localStorage.setItem('jb_roster_me',me);localStorage.setItem('jb_roster_nm',P[me].n)}catch(_){}closeSheet();renderAll();return}
  const dy=e.target.closest('[data-day]');if(dy&&me!=null){dayDetail(dy.dataset.day);return}
  if(e.target.id=='closeS'){closeSheet();return}
  const v=e.target.closest('nav [data-v]');if(v){go(v.dataset.v);return}
  const mb=e.target.closest('[data-m]');if(mb){calM=new Date(calM.getFullYear(),calM.getMonth()+ +mb.dataset.m,1);renderCal();return}
  const wb=e.target.closest('[data-w]');if(wb){wkS=addD(wkS,7*wb.dataset.w);renderTeam();return}
  const ts=e.target.closest('[data-tlsub]');if(ts){tlSub=ts.dataset.tlsub;renderToday();return}
  const sb=e.target.closest('[data-sub]');if(sb){sub=sb.dataset.sub;renderTeam();return}
});
$('meBtn').onclick=pickMe;$('q').oninput=e=>{q=e.target.value.trim();renderTeam()};
const TITLES={today:'오늘',mine:'내 근무',team:'전체 근무',notice:'일정'};
function go(v){document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id=='v-'+v));document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('hTitle').textContent=TITLES[v];window.scrollTo(0,0)}
function swipe(el,fn){let x0=null,y0=null;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))fn(dx<0?1:-1);x0=null},{passive:true})}
swipe($('calWrap'),n=>{calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);renderCal()});
swipe($('tbl'),n=>{wkS=addD(wkS,7*n);renderTeam()});

setInterval(()=>{if(me!=null&&document.getElementById('v-today').classList.contains('on'))renderToday()},60000);

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pin){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const alg=ENC.m==='cbc'?'AES-CBC':'AES-GCM';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:alg,length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:alg,iv:b64(ENC.i)},key,b64(ENC.c));
  window.__D=JSON.parse(new TextDecoder().decode(pt));
}
async function tryPin(pin,remember){
  try{await unlock(pin)}catch(e){return false}
  try{if(remember)localStorage.setItem('jb_pin',pin)}catch(_){}
  document.getElementById('lock').remove();
  const s=document.createElement('script');s.textContent=document.getElementById('appjs').textContent.replace(/<\\\//g,'</');document.body.appendChild(s);
  try{if(sessionStorage.getItem('jb_upd')){sessionStorage.removeItem('jb_upd');toastUpd()}}catch(_){}
  startChk();
  return true;
}
// 새 근무표 확인: 앱으로 돌아올 때 + 켜 둔 동안 5분마다. 바뀌었으면 새로 고침(저장된 비밀번호로 바로 열림)
let chkBusy=false,lastChk=Date.now();
async function chk(){
  if(chkBusy||document.visibilityState!=='visible')return;chkBusy=true;lastChk=Date.now();
  try{const r=await fetch('./?__chk='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const t=await r.text();const k=t.indexOf('const ENC=');if(k<0)return;
    const m=t.slice(k).match(/"c"\s*:\s*"([^"]+)"/);
    if(m&&m[1]!==ENC.c){try{sessionStorage.setItem('jb_upd','1')}catch(_){}location.reload()}
  }catch(_){}finally{chkBusy=false}
}
function startChk(){
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastChk>20000)chk()});
  window.addEventListener('focus',()=>{if(Date.now()-lastChk>20000)chk()});
  setInterval(chk,300000);
}
function toastUpd(){const d=document.createElement('div');d.textContent='새 근무표로 업데이트했어요';
  d.style.cssText='position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f3a8a;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25)';
  document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
(async()=>{
  let saved=null;try{saved=localStorage.getItem('jb_pin')}catch(_){}
  if(saved&&await tryPin(saved,false))return;
  const go=async()=>{const v=document.getElementById('pin').value.trim();document.getElementById('pinErr').textContent='확인 중…';
    if(!await tryPin(v,true)){document.getElementById('pinErr').textContent='비밀번호가 맞지 않아요';document.getElementById('pin').value=''}};
  document.getElementById('pinBtn').onclick=go;
  document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
